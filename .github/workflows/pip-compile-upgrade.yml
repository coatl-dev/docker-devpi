name: pip-compile-upgrade

on:
  schedule:
    - cron: '0 20 14,28 * *'
  workflow_dispatch:

jobs:
  pip-compile-upgrade:
    uses: coatl-dev/workflows/.github/workflows/uv-pip-compile-upgrade.yml@fbb4c65688da8a630c087fcc71fed9d93dd9e162 # v7.0.33
    with:
      path: requirements
    secrets:
      gh-token: ${{ secrets.COATL_BOT_GH_TOKEN }}
      gpg-sign-passphrase: ${{ secrets.COATL_BOT_GPG_PASSPHRASE }}
      gpg-sign-private-key: ${{ secrets.COATL_BOT_GPG_PRIVATE_KEY }}
