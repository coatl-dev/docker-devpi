name: pip-compile-upgrade

on:
  schedule:
    - cron: '0 20 14,28 * *'
  workflow_dispatch:

jobs:
  pip-compile-upgrade:
    uses: coatl-dev/workflows/.github/workflows/uv-pip-compile-upgrade.yml@92e51b14907b5aac1a8af1fcd9c2a1a5369dc47a # v7.0.32
    with:
      path: requirements
    secrets:
      gh-token: ${{ secrets.COATL_BOT_GH_TOKEN }}
      gpg-sign-passphrase: ${{ secrets.COATL_BOT_GPG_PASSPHRASE }}
      gpg-sign-private-key: ${{ secrets.COATL_BOT_GPG_PRIVATE_KEY }}
